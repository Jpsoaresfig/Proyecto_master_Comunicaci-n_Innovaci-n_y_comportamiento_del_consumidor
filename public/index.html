<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Bass Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="phone" id="app"><div class="center"><p class="muted"><span class="wait-dot"></span>Conectando…</p></div></div>

<script type="module">
import { connect, PRODUCTS, NONE, productById, adoptedRound, adoptedProduct, canVote, stats, esc, pct, store } from './common.js';

const app = document.getElementById('app');
let id = store('bass_id');
if (!id) { id = 'u' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store('bass_id', id); }
const myId = () => (state && state.me) || id;
let state = null, api = null, lastHtml = '', busy = false, error = '';
let wasIn = false; // ya había entrado: si deja de estar en la lista, el presentador lo quitó o reinició
let sending = null; // ronda cuyo voto espera la confirmación del servidor
let editing = null; // ronda cuya respuesta se está cambiando

const header = (p) => `<header><div class="brand">BASS <b>CHALLENGE</b></div>${p ? `<div class="who">${esc(p.name)}</div>` : ''}</header>`;
const pic = (prod, cls = 'pic') => `<div class="${cls}" style="background:${prod.color}22;color:${prod.color}">${prod.icon}</div>`;
const miniProd = (prod) => `<div class="card mini-prod">${pic(prod)}<div><div style="font-weight:700">${prod.name}</div><div class="muted" style="font-size:14px">${prod.desc} · ${prod.price} (precio hipotético)</div></div></div>`;

function socialBox(s) {
  return `<div class="card social">
    <div class="muted" style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:600">Ya compraron</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin:8px 0 12px"><span class="big num">${s.adopters}</span><span class="muted">de ${s.N} personas (${s.total.share}%)</span></div>
    ${s.byProduct.map((p) => `<div class="row"><span>${p.name}</span><b class="num" style="color:var(--text)">${p.adopters}</b></div>
    <div class="bar-track" style="margin:0 0 8px"><div class="bar-fill" style="width:${p.share}%;background:${p.color}"></div></div>`).join('')}
  </div>`;
}

const NONE_LABEL = 'Ninguno por ahora';
const choiceLabel = (v) => (v === NONE ? NONE_LABEL : productById(v).name);

function question(round, p) {
  const s = stats(state, round - 1);
  const texts = {
    1: { tag: 'Ronda 1', q: 'Estos dos móviles acaban de salir. ¿Cuál comprarías siendo de los primeros, sin saber qué harán los demás?' },
    2: { tag: 'Ronda 2', q: 'Ahora que sabes cuántas personas ya compraron, ¿comprarías alguno?' },
    3: { tag: 'Última ronda', q: 'Con todo lo que has visto, ¿comprarías alguno?' },
  }[round];
  const a = adoptedRound(p);
  if (a !== -1 && a < round - 1) {
    return `<div class="fade-in"><span class="tag"><i></i>${texts.tag}</span>
      <h1>Ya compraste en la ronda ${a + 1}</h1><p>Ahora formas parte de quienes influyen en los demás.</p>
      ${miniProd(adoptedProduct(p))}${socialBox(s)}</div>`;
  }
  if (sending === round) {
    return `<div class="center fade-in"><span class="tag"><i></i>${texts.tag}</span><h1>Enviando respuesta…</h1>
      <p class="muted"><span class="wait-dot"></span>Espera un momento.</p></div>`;
  }
  if (p.votes[round - 1] !== null && editing !== round) {
    return `<div class="center fade-in"><div class="ok-badge">✓</div><h1>Respuesta registrada</h1>
      <p>Tu respuesta: <b style="color:var(--text)">${choiceLabel(p.votes[round - 1])}</b>.</p>
      <button class="btn ghost" data-edit="${round}" style="margin-top:8px">Cambiar mi respuesta</button>
      <p class="muted"><span class="wait-dot"></span>Puedes cambiarla hasta que se revelen los resultados.</p></div>`;
  }
  const dis = busy ? 'disabled' : '';
  return `<div class="fade-in"><span class="tag"><i></i>${texts.tag}</span>
    <h1 style="font-size:25px">${texts.q}</h1>
    ${round > 1 ? socialBox(s) : '<p class="muted" style="font-size:14px">Piensa en tu próxima compra de móvil. Precio hipotético.</p>'}
    <div class="choice">
      ${PRODUCTS.map((x) => `<button class="prod-opt" style="--c:${x.color}" data-vote="${x.id}" ${dis}>
        ${pic(x)}<div><div class="t">${x.name}</div><div class="d">${x.desc}</div></div><div class="pr">${x.price}</div></button>`).join('')}
      <button class="btn ghost" data-vote="${NONE}" ${dis}>${NONE_LABEL}</button>
    </div><div class="err">${esc(error)}</div></div>`;
}

const connErrorView = () => header() + `<div class="center fade-in"><span class="tag"><i></i>Sin conexión</span><h1>No se pudo conectar</h1>
  <p>Comprueba tu conexión a internet. Si abriste el QR dentro de otra aplicación, ábrelo en Chrome o Safari.</p><button class="btn" onclick="location.reload()">Reintentar</button></div>`;

function view() {
  if (state.connError) return connErrorView();
  const p = state.participants[myId()];
  // Sin participante en la última etapa: la sesión terminó o el presentador creó otra con un código nuevo.
  const closed = !p && state.stage === 'marketing';
  if (state.noSession || (closed && state.sessionId)) {
    return header() + `<div class="center fade-in"><span class="tag"><i></i>${closed ? 'Sesión terminada' : 'Bass Challenge'}</span><h1>Escanea el código QR</h1><p>${closed ? 'Esta sesión ya terminó. Escanea el código actual o escribe' : 'O escribe'} el código de acceso que aparece en la pantalla del presentador.</p>
      <form id="code" class="stack"><input class="field" id="sid" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Código de acceso" style="text-align:center;letter-spacing:.15em" required>
      <button class="btn">Entrar</button></form><div class="err">${esc(error)}</div>
      <p class="muted" style="margin-top:24px">¿Eres el presentador? <a href="presentador" style="color:var(--accent)">Abrir el panel con el QR →</a></p></div>`;
  }
  if (!p) {
    return header() + `<div class="center fade-in">
      <span class="tag"><i></i>Modelo de difusión de Bass</span>
      <h1>Únete al desafío</h1><p>${wasIn ? 'El presentador te ha quitado de la lista o ha reiniciado la simulación. Pulsa «Entrar» si quieres participar.' : 'Escribe un apodo para participar en la simulación.'}</p>
      <form id="join" class="stack"><input class="field" id="name" maxlength="18" autocomplete="off" placeholder="Tu apodo" value="${esc(store('bass_name') || '')}" required>
      <button class="btn" ${busy ? 'disabled' : ''}>${busy ? 'Entrando…' : 'Entrar'}</button></form><div class="err">${esc(error)}</div></div>`;
  }
  const st = state.stage;
  if (st === 'lobby') {
    return header(p) + `<div class="center fade-in"><span class="tag"><i></i>Ya estás dentro</span>
      <h1>Dos móviles salen al mercado</h1><p>En cada ronda podrás comprar uno o ninguno.</p>
      ${PRODUCTS.map(miniProd).join('')}
      <p class="muted"><span class="wait-dot"></span>La dinámica comenzará en breve.</p></div>`;
  }

  if (st === 'r1' || st === 'r2' || st === 'r3') return header(p) + question(Number(st[1]), p);

  if (st === 'res1' || st === 'res2') {
    return header(p) + `<div class="center fade-in"><span class="tag"><i></i>Resultados</span><h1>Mira la pantalla</h1>
      <p>El presentador está mostrando cuántas personas compraron cada móvil.</p>${socialBox(stats(state, st === 'res1' ? 1 : 2))}</div>`;
  }

  // final / bass / marketing
  const a = adoptedRound(p);
  const s = stats(state);
  return header(p) + `<div class="center fade-in"><span class="tag"><i></i>Fin de la simulación</span>
    <h1>${a === -1 ? 'No compraste ningún móvil' : `Compraste en la ronda ${a + 1}`}</h1>
    <p>${a === 0 ? 'Compraste por iniciativa propia, antes de ver las compras de otros: perfil <b style="color:var(--text)">innovador</b> (p).'
      : a > 0 ? 'Compraste después de ver las compras de otros: si eso influyó en ti, tu perfil es <b style="color:var(--text)">imitador</b> (q).'
      : 'Formas parte del mercado que aún no adoptó: 1 − F(t).'}</p>
    ${a === -1 ? '' : miniProd(adoptedProduct(p))}
    <p>Adopción final de la clase: <b style="color:var(--text)">${s.adopters} de ${s.N} (${s.total.share}%)</b>.</p>
    <p class="muted">¡Gracias por participar! Mira la pantalla principal.</p></div>`;
}

function render() {
  if (!state) return;
  const html = view();
  if (html !== lastHtml) { app.innerHTML = html; lastHtml = html; }
}

// Sin conexión, Firestore espera indefinidamente: mejor avisar.
const withTimeout = (p) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('La conexión es lenta. Comprueba tu internet y vuelve a intentarlo.')), 10000))]);

async function act(fn) {
  if (busy) return;
  busy = true; error = ''; render();
  try { await fn(); } catch (e) { error = e.message || 'Error de conexión'; }
  busy = false; render();
}

app.addEventListener('submit', (e) => {
  if (e.target.id === 'code') {
    e.preventDefault();
    const sid = document.getElementById('sid').value.trim().toLowerCase();
    if (/^[a-z0-9]{4,12}$/.test(sid)) location.search = '?s=' + sid;
    else { error = 'Código no válido'; lastHtml = ''; render(); }
    return;
  }
  if (e.target.id !== 'join') return;
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  if (!name) return;
  store('bass_name', name);
  act(() => withTimeout(api.join(myId(), name)));
});
app.addEventListener('click', (e) => {
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) { editing = Number(editBtn.dataset.edit); return render(); }
  const voteBtn = e.target.closest('[data-vote]');
  if (voteBtn) {
    const round = Number(state.stage[1]);
    if (canVote(state, state.participants[myId()], round)) {
      if (busy) return;
      sending = round;
      act(() => withTimeout(api.vote(myId(), round, voteBtn.dataset.vote)).then(() => { editing = null; }).finally(() => { sending = null; }));
    }
  }
});

// Si la conexión tarda demasiado, ofrece reintentar en lugar de quedarse en «Conectando…».
setTimeout(() => { if (!state) app.innerHTML = connErrorView(); }, 15000);
api = await connect((s) => {
  if (state && s.stage !== state.stage) { editing = null; error = ''; }
  state = s;
  // Quien sale de la lista no vuelve solo: debe pulsar «Entrar» (así no quedan móviles olvidados).
  if (s.participants[myId()]) wasIn = true;
  else editing = null;
  render();
}).catch(() => { app.innerHTML = connErrorView(); });
</script>
</body>
</html>
